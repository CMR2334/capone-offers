name: Ingest + deploy

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ingest-deploy
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run ingestor
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: node ingestor/ingest.js
      - name: Commit updated offers.json
        run: |
          if [[ -n $(git status --porcelain public/offers.json) ]]; then
            git config user.name "capone-shopping-bot"
            git config user.email "bot@users.noreply.github.com"
            git add public/offers.json
            git commit -m "ingest: refresh offers $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # Retry up to 3 times: if push is rejected by a concurrent run, rebase
            # (prefer our ingestor output on conflict) and retry.
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs
            done
          else
            echo "No changes to offers.json"
          fi

  deploy:
    needs: ingest
    runs-on: ubuntu-latest
    # The deploy job uses a second GitHub-hosted runner. Treat runner startup
    # failures/cancellations as non-fatal once ingestion has succeeded; Pages can
    # catch up on the next run without turning a healthy refresh into an alert.
    continue-on-error: true
    outputs:
      pages_warning: ${{ steps.configure_pages.outcome == 'failure' || steps.upload_artifact.outcome == 'failure' || steps.deployment.outcome == 'failure' }}
    environment:
      name: github-pages
      url: https://cmr2334.github.io/capone-shopping/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: configure_pages
        uses: actions/configure-pages@v4
        continue-on-error: true
      - id: upload_artifact
        if: steps.configure_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./public
      - id: deployment
        if: steps.configure_pages.outcome == 'success' && steps.upload_artifact.outcome == 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 600000
      - name: Warn on Pages-only pipeline failure
        if: steps.configure_pages.outcome == 'failure' || steps.upload_artifact.outcome == 'failure' || steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::GitHub Pages setup/upload/deploy failed after ingest succeeded. offers.json was committed; the live site may lag until GitHub Pages recovers and a later run publishes it."

  # Keep true ingest/auth/parser failures loud. Deploy-only failures are handled
  # separately because offers.json was already refreshed successfully.
  notify-failure:
    needs: ingest
    if: always() && needs.ingest.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open a failure issue (deduped on an open one)
        run: |
          set -euo pipefail
          gh label create ingest-failure --color B60205 --description "Ingest/deploy workflow failure" 2>/dev/null || true
          existing=$(gh issue list --label ingest-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Failure issue #$existing already open — not duplicating."
            exit 0
          fi
          body=$(printf '%s\n' \
            "The scheduled ingest job failed, so public/offers.json is not being refreshed." \
            "" \
            "Likely causes: an expired GMAIL_REFRESH_TOKEN (rotate it — see HANDOFF.md → Infrastructure & secrets map), a Gmail API/format change, or a parser regression. The live site shows a staleness banner once data is ~8h old." \
            "" \
            "Failed run: $RUN_URL" \
            "Commit: $GITHUB_SHA" \
            "" \
            "Close this issue once the pipeline is healthy again; the next failure will open a fresh one.")
          gh issue create --label ingest-failure --title "Ingest workflow failing" --body "$body"

  # Pages pipeline and deploy-runner failures are usually upstream GitHub
  # conditions. Keep the workflow green, but leave a deduped issue trail when the
  # warning job can run.
  notify-deploy-warning:
    needs: [ingest, deploy]
    if: >-
      always() &&
      needs.ingest.result == 'success' &&
      (needs.deploy.result != 'success' ||
      needs.deploy.outputs.pages_warning == 'true')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open a Pages deploy issue (deduped on an open one)
        continue-on-error: true
        run: |
          set -euo pipefail
          gh label create pages-deploy-warning --color D4A72C --description "GitHub Pages deploy delayed or timed out" 2>/dev/null || true
          existing=$(gh issue list --label pages-deploy-warning --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Pages deploy issue #$existing already open — not duplicating."
            exit 0
          fi
          body=$(printf '%s\n' \
            "The ingestor succeeded and committed public/offers.json, but the GitHub Pages setup/upload/deploy pipeline failed." \
            "" \
            "This is usually a GitHub Pages queue/API/service degradation. The live site may lag until the next successful deploy publishes the latest committed feed." \
            "" \
            "Failed deploy run: $RUN_URL" \
            "Commit: $GITHUB_SHA" \
            "" \
            "The workflow intentionally treats Pages-only deploy timeouts as warnings to avoid repeated failure emails while ingestion is healthy. Close this issue once a later deploy is green.")
          gh issue create --label pages-deploy-warning --title "GitHub Pages deploy delayed or failing" --body "$body"
